name: Feature request
description: Suggest an improvement for this package
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem to solve
      description: What use case or limitation does this address?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
